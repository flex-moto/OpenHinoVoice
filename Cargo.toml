[package]
name = "openhinovoice"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Japanese voice input for Windows and macOS with local speech recognition"
repository = "https://github.com/iiinno/OpenHinoVoice"

[package.metadata.winresource]
ProductName = "OpenHinoVoice"
FileDescription = "OpenHinoVoice - Japanese voice input for Windows"
OriginalFilename = "openhinovoice.exe"
InternalName = "openhinovoice"
LegalCopyright = "Copyright (c) 2026 iiinno"

[build-dependencies]
winresource = "0.1.34"

[dependencies]

cpal = "0.15"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
toml = "0.8"
toml_edit = "0.22"
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
tray-icon = "0.21"
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"

[profile.release]
opt-level = 2
# exe を小さく保つ。挙動は変えない
lto = true
codegen-units = 1
strip = true
panic = "abort"
